name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-sanity:
    name: Public source sanity — Python 3.9
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Show environment
        run: |
          set -euo pipefail
          python3 --version
          bash --version | head -n 1
          git --version

      - name: Check tracked files for whitespace errors
        run: |
          set -euo pipefail
          git diff --check

      - name: Run public source sanity checks
        run: |
          set -euo pipefail
          ./tools/public-sanity-check.sh

      - name: Verify tests did not modify source tree
        run: |
          set -euo pipefail

          status="$(git status --porcelain --untracked-files=all)"

          if [ -n "$status" ]; then
            echo "ERROR: CI checks modified or generated files in the source tree:"
            printf '%s\n' "$status"
            exit 1
          fi

          echo "source tree remains clean: PASS"

  package-build-audit:
    name: Debian 11 package build + audit
    needs:
      - public-source-sanity

    runs-on: ubuntu-latest
    timeout-minutes: 25

    container:
      image: debian:11

    defaults:
      run:
        shell: bash

    steps:
      - name: Install Debian 11 build dependencies
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          # Debian 11 Bullseye reached LTS EOL in August 2026.
          # Use Debian's immutable archive instead of the retired live mirrors.
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources

          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no] http://archive.debian.org/debian bullseye main
          deb [check-valid-until=no] http://archive.debian.org/debian bullseye-updates main
          deb [check-valid-until=no] http://archive.debian.org/debian-security bullseye-security main
          APT

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            build-essential \
            dpkg-dev \
            pkg-config \
            intltool \
            gettext \
            libglib2.0-dev \
            libsqlite3-dev \
            libimobiledevice-dev \
            libplist-dev \
            libxml2-dev \
            zlib1g-dev \
            libusb-1.0-0-dev \
            file

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Debian build environment
        run: |
          set -euo pipefail

          cat /etc/debian_version
          python3 --version
          gcc --version | head -n 1
          dpkg --print-architecture

          python3 --version | grep -E '^Python 3\.9\.'
          test "$(dpkg --print-architecture)" = "amd64"

          echo "Debian 11 amd64 build environment: PASS"

      - name: Run source sanity checks on Debian 11
        run: |
          set -euo pipefail
          ./tools/public-sanity-check.sh

      - name: Build Debian package
        run: |
          set -euo pipefail
          ./build-deb.sh

      - name: Audit Debian package
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one Debian package; found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          ./tools/audit-deb.sh "${packages[0]}"
