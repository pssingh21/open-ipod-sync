name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-sanity:
    name: Public source sanity — Python 3.9
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'

      - name: Show environment
        run: |
          set -euo pipefail
          python3 --version
          bash --version | head -n 1
          git --version

      - name: Check tracked files for whitespace errors
        run: |
          set -euo pipefail
          git diff --check

      - name: Run public source sanity checks
        run: |
          set -euo pipefail
          ./tools/public-sanity-check.sh

      - name: Verify tests did not modify source tree
        run: |
          set -euo pipefail

          status="$(git status --porcelain --untracked-files=all)"

          if [ -n "$status" ]; then
            echo "ERROR: CI checks modified or generated files in the source tree:"
            printf '%s\n' "$status"
            exit 1
          fi

          echo "source tree remains clean: PASS"

  package-build-audit:
    name: Debian 11 package build + audit
    needs:
      - public-source-sanity

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    container:
      image: debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9

    defaults:
      run:
        shell: bash

    steps:
      - &debian11_snapshot
        name: Configure pinned Debian 11 snapshot
        run: |
          set -euo pipefail

          # Debian 11 Bullseye reached LTS EOL in August 2026.
          #
          # Pin CI to a coherent Debian Snapshot from immediately before EOL.
          # This avoids retired/archive mirrors whose package indexes may refer
          # to binary files that are no longer present in the pool.
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources

          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260830T235959Z/ bullseye-security main
          APT

          # snapshot.debian.org can occasionally return transient gateway
          # errors. Apply retries to both apt update and package downloads.
          cat > /etc/apt/apt.conf.d/80-ci-retries <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          APT

          apt-get update

      - &debian11_build_dependencies
        name: Install Debian 11 build dependencies
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            build-essential \
            dpkg-dev \
            pkg-config \
            intltool \
            gettext \
            libglib2.0-dev \
            libsqlite3-dev \
            libimobiledevice-dev \
            libplist-dev \
            libxml2-dev \
            zlib1g-dev \
            libusb-1.0-0-dev \
            file

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust CI checkout for Git metadata
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          git -C "$GITHUB_WORKSPACE" log -1 --format='epoch=%ct date=%cI'

      - name: Verify Debian build environment
        run: |
          set -euo pipefail

          cat /etc/debian_version
          python3 --version
          gcc --version | head -n 1
          dpkg-deb --version | head -n 1
          dpkg-query -W -f='dpkg=${Version}\n' dpkg
          xz --version | head -n 1
          tar --version | head -n 1
          dpkg --print-architecture

          python3 --version | grep -E '^Python 3\.9\.'
          test "$(dpkg --print-architecture)" = "amd64"

          echo "Debian 11 amd64 build environment: PASS"

      - name: Run source sanity checks on Debian 11
        run: |
          set -euo pipefail
          ./tools/public-sanity-check.sh

      - name: Build Debian package
        run: |
          set -euo pipefail
          ./build-deb.sh

      - name: Audit Debian package
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one Debian package; found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          ./tools/audit-deb.sh "${packages[0]}"
      - name: Prepare audited CI artifact with SBOM and provenance
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one audited Debian package" >&2
            exit 1
          fi

          mkdir -p ci-artifact

          package_name="$(basename "${packages[0]}")"
          cp "${packages[0]}" "ci-artifact/$package_name"

          git_commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git log -1 --format=%ct)"

          python3 tools/generate-supply-chain-metadata.py \
            "ci-artifact/$package_name" \
            --output-dir ci-artifact \
            --git-commit "$git_commit" \
            --source-date-epoch "$source_date_epoch" \
            --build-environment \
              "debian-11-amd64-snapshot-20260830T235959Z"

          (
            cd ci-artifact

            mapfile -t checksum_files < <(
              find . \
                -maxdepth 1 \
                -type f \
                \( \
                  -name '*.deb' -o \
                  -name '*.spdx.json' -o \
                  -name 'PROVENANCE.json' \
                \) \
                -printf '%f\n' |
              sort
            )

            if [[ "${#checksum_files[@]}" -ne 3 ]]; then
              echo "ERROR: expected Debian package, SPDX SBOM, and provenance" >&2
              printf '%s\n' "${checksum_files[@]}" >&2
              exit 1
            fi

            sha256sum "${checksum_files[@]}" > SHA256SUMS
          )

          echo "===== CI ARTIFACT ====="
          ls -l ci-artifact

          echo
          cat ci-artifact/SHA256SUMS

      - name: Upload audited Debian package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: |
            ci-artifact/*.deb
            ci-artifact/*.spdx.json
            ci-artifact/PROVENANCE.json
            ci-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  reproducibility-check:
    name: Debian 11 reproducibility gate
    needs: package-build-audit
    runs-on: ubuntu-24.04

    container:
      image: debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9

    defaults:
      run:
        shell: bash

    steps:
      - *debian11_snapshot
      - *debian11_build_dependencies

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust CI checkout for Git metadata
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          git -C "$GITHUB_WORKSPACE" log -1 --format='epoch=%ct date=%cI'

      - name: Download audited build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: baseline

      - name: Verify audited build artifact
        run: |
          set -euo pipefail

          (
            cd baseline
            sha256sum -c SHA256SUMS
          )

      - name: Build independent comparison package
        run: |
          set -euo pipefail
          ./build-deb.sh

      - name: Generate independent SBOM and provenance
        run: |
          set -euo pipefail

          mapfile -t rebuilt_packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#rebuilt_packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one independently rebuilt package" >&2
            exit 1
          fi

          mkdir -p rebuilt-bundle

          package_name="$(basename "${rebuilt_packages[0]}")"
          cp "${rebuilt_packages[0]}" "rebuilt-bundle/$package_name"

          git_commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git log -1 --format=%ct)"

          python3 tools/generate-supply-chain-metadata.py \
            "rebuilt-bundle/$package_name" \
            --output-dir rebuilt-bundle \
            --git-commit "$git_commit" \
            --source-date-epoch "$source_date_epoch" \
            --build-environment \
              "debian-11-amd64-snapshot-20260830T235959Z"

          (
            cd rebuilt-bundle

            mapfile -t checksum_files < <(
              find . \
                -maxdepth 1 \
                -type f \
                \( \
                  -name '*.deb' -o \
                  -name '*.spdx.json' -o \
                  -name 'PROVENANCE.json' \
                \) \
                -printf '%f\n' |
              sort
            )

            [[ "${#checksum_files[@]}" -eq 3 ]] || {
              echo "ERROR: unexpected rebuilt supply-chain bundle" >&2
              printf '%s\n' "${checksum_files[@]}" >&2
              exit 1
            }

            sha256sum "${checksum_files[@]}" > SHA256SUMS
          )

      - name: Verify reproducible Debian package and supply-chain metadata
        run: |
          set -euo pipefail

          mapfile -t baseline_packages < <(
            find baseline \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          mapfile -t rebuilt_packages < <(
            find rebuilt-bundle \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          mapfile -t baseline_sboms < <(
            find baseline \
              -maxdepth 1 \
              -type f \
              -name '*.spdx.json' \
              -print
          )

          mapfile -t rebuilt_sboms < <(
            find rebuilt-bundle \
              -maxdepth 1 \
              -type f \
              -name '*.spdx.json' \
              -print
          )

          [[ "${#baseline_packages[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one baseline Debian package" >&2
            exit 1
          }

          [[ "${#rebuilt_packages[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one rebuilt Debian package" >&2
            exit 1
          }

          [[ "${#baseline_sboms[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one baseline SPDX SBOM" >&2
            exit 1
          }

          [[ "${#rebuilt_sboms[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one rebuilt SPDX SBOM" >&2
            exit 1
          }

          [[ -f baseline/PROVENANCE.json ]] || {
            echo "ERROR: baseline provenance missing" >&2
            exit 1
          }

          [[ -f rebuilt-bundle/PROVENANCE.json ]] || {
            echo "ERROR: rebuilt provenance missing" >&2
            exit 1
          }

          [[ -f baseline/SHA256SUMS ]] || {
            echo "ERROR: baseline SHA256SUMS missing" >&2
            exit 1
          }

          [[ -f rebuilt-bundle/SHA256SUMS ]] || {
            echo "ERROR: rebuilt SHA256SUMS missing" >&2
            exit 1
          }

          echo "===== BASELINE BUNDLE ====="
          (
            cd baseline
            sha256sum -c SHA256SUMS
          )

          echo
          echo "===== INDEPENDENT REBUILD BUNDLE ====="
          (
            cd rebuilt-bundle
            sha256sum -c SHA256SUMS
          )

          echo
          echo "===== BYTE-FOR-BYTE REPRODUCIBILITY ====="

          cmp -s "${baseline_packages[0]}" "${rebuilt_packages[0]}" || {
            echo "ERROR: Debian package is not byte-for-byte reproducible" >&2
            exit 1
          }

          echo "Debian package: PASS"

          cmp -s "${baseline_sboms[0]}" "${rebuilt_sboms[0]}" || {
            echo "ERROR: SPDX SBOM is not byte-for-byte reproducible" >&2
            exit 1
          }

          echo "SPDX SBOM:     PASS"

          cmp -s baseline/PROVENANCE.json rebuilt-bundle/PROVENANCE.json || {
            echo "ERROR: provenance metadata is not byte-for-byte reproducible" >&2
            exit 1
          }

          echo "provenance:     PASS"

          cmp -s baseline/SHA256SUMS rebuilt-bundle/SHA256SUMS || {
            echo "ERROR: SHA256SUMS is not byte-for-byte reproducible" >&2
            exit 1
          }

          echo "SHA256SUMS:     PASS"

          echo
          echo "PASS: complete audited supply-chain bundle is reproducible"

  package-lifecycle:
    name: Debian 11 package lifecycle
    needs: package-build-audit
    runs-on: ubuntu-24.04

    container:
      image: debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9

    defaults:
      run:
        shell: bash

    steps:
      - *debian11_snapshot

      - name: Install Debian 11 runtime dependencies
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            diffutils \
            ifuse \
            libimobiledevice-utils \
            usbmuxd \
            ffmpeg \
            gcc \
            pkg-config \
            libglib2.0-dev \
            util-linux \
            libc6 \
            libglib2.0-0 \
            libimobiledevice6 \
            libplist3 \
            libsqlite3-0 \
            libxml2 \
            zlib1g \
            libusb-1.0-0

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download audited Debian package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: lifecycle-artifact

      - name: Verify audited artifact checksum
        run: |
          set -euo pipefail

          (
            cd lifecycle-artifact
            sha256sum -c SHA256SUMS
          )

      - name: Run package lifecycle tests
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find lifecycle-artifact \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one audited Debian package" >&2
            exit 1
          fi

          ./tools/test-package-lifecycle.sh "${packages[0]}"

  attest-supply-chain:
    name: GitHub artifact attestations

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - package-build-audit
      - reproducibility-check
      - package-lifecycle

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download audited supply-chain bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: attested

      - name: Verify audited supply-chain bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          (
            cd attested
            sha256sum -c SHA256SUMS
          )

          shopt -s nullglob

          debs=(attested/ipod-sync_*_amd64.deb)
          sboms=(attested/*.spdx.json)

          [[ "${#debs[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one Debian package; found ${#debs[@]}" >&2
            exit 1
          }

          [[ "${#sboms[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one SPDX SBOM; found ${#sboms[@]}" >&2
            exit 1
          }

          [[ -f attested/PROVENANCE.json ]] || {
            echo "ERROR: PROVENANCE.json missing" >&2
            exit 1
          }

          [[ -f attested/SHA256SUMS ]] || {
            echo "ERROR: SHA256SUMS missing" >&2
            exit 1
          }

          printf 'deb=%s\n' "${debs[0]}" >> "$GITHUB_OUTPUT"
          printf 'sbom=%s\n' "${sboms[0]}" >> "$GITHUB_OUTPUT"

          echo "audited bundle verification: PASS"

      - name: Attest audited release artifacts with SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            attested/*.deb
            attested/*.spdx.json
            attested/PROVENANCE.json
            attested/SHA256SUMS

      - name: Attest Debian package with SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.deb }}
          sbom-path: ${{ steps.bundle.outputs.sbom }}
