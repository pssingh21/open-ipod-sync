name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-sanity:
    name: Public source sanity — Python 3.9
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'

      - name: Show environment
        run: |
          set -euo pipefail
          python3 --version
          bash --version | head -n 1
          git --version

      - name: Check tracked files for whitespace errors
        run: |
          set -euo pipefail
          git diff --check

      - name: Run public source sanity checks
        run: |
          set -euo pipefail
          ./tools/public-sanity-check.sh

      - name: Verify tests did not modify source tree
        run: |
          set -euo pipefail

          status="$(git status --porcelain --untracked-files=all)"

          if [ -n "$status" ]; then
            echo "ERROR: CI checks modified or generated files in the source tree:"
            printf '%s\n' "$status"
            exit 1
          fi

          echo "source tree remains clean: PASS"

  package-build-audit:
    name: Debian 11 package build + audit
    needs:
      - public-source-sanity

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    container:
      image: debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure pinned Debian 11 snapshot
        run: |
          set -euo pipefail

          # Debian 11 Bullseye reached LTS EOL in August 2026.
          #
          # Pin CI to a coherent Debian Snapshot from immediately before EOL.
          # This avoids retired/archive mirrors whose package indexes may refer
          # to binary files that are no longer present in the pool.
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources

          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260830T235959Z/ bullseye-security main
          APT

          # snapshot.debian.org can occasionally return transient gateway
          # errors. Apply retries to both apt update and package downloads.
          cat > /etc/apt/apt.conf.d/80-ci-retries <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          APT

          apt-get update

      - name: Install Debian 11 build dependencies
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            build-essential \
            dpkg-dev \
            pkg-config \
            intltool \
            gettext \
            libglib2.0-dev \
            libsqlite3-dev \
            libimobiledevice-dev \
            libplist-dev \
            libxml2-dev \
            zlib1g-dev \
            libusb-1.0-0-dev \
            file

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust CI checkout for Git metadata
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          git -C "$GITHUB_WORKSPACE" log -1 --format='epoch=%ct date=%cI'

      - name: Verify Debian build environment
        run: |
          set -euo pipefail

          cat /etc/debian_version
          python3 --version
          gcc --version | head -n 1
          dpkg-deb --version | head -n 1
          dpkg-query -W -f='dpkg=${Version}\n' dpkg
          xz --version | head -n 1
          tar --version | head -n 1
          dpkg --print-architecture

          python3 --version | grep -E '^Python 3\.9\.'
          test "$(dpkg --print-architecture)" = "amd64"

          echo "Debian 11 amd64 build environment: PASS"

      - name: Run source sanity checks on Debian 11
        run: |
          set -euo pipefail
          ./tools/public-sanity-check.sh

      - name: Native ASan and UBSan gate
        run: |
          set -euo pipefail
          ./tools/test-native-sanitizers.sh

      - name: Build Debian package
        run: |
          set -euo pipefail
          ./build-deb.sh

      - name: Audit Debian package
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one Debian package; found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          ./tools/audit-deb.sh "${packages[0]}"
      - name: Prepare audited CI artifact with SBOM and provenance
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one audited Debian package" >&2
            exit 1
          fi

          rm -rf ci-artifact ci-toolchain-view
          mkdir -p ci-artifact

          package_name="$(basename "${packages[0]}")"
          cp "${packages[0]}" "ci-artifact/$package_name"

          git_commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git log -1 --format=%ct)"

          python3 tools/generate-supply-chain-metadata.py \
            "ci-artifact/$package_name" \
            --output-dir ci-artifact \
            --git-commit "$git_commit" \
            --source-date-epoch "$source_date_epoch" \
            --build-environment \
              "debian-11-amd64-snapshot-20260830T235959Z"

          source_name="open-ipod-sync-${git_commit}-source.tar"

          ./tools/make-source-archive.sh \
            "ci-artifact/$source_name" \
            "$git_commit"

          python3 tools/create-toolchain-view.py \
            --output-dir ci-toolchain-view \
            --manifest ci-artifact/TOOLCHAIN.json

          python3 tools/generate-build-materials.py \
            --source-archive "ci-artifact/$source_name" \
            --source-commit "$git_commit" \
            --source-date-epoch "$source_date_epoch" \
            --snapshot-identity \
              "debian-11-amd64-snapshot-20260830T235959Z" \
            --base-image-identity \
              "debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9" \
            --output ci-artifact/BUILD-MATERIALS.json

          rm -rf ci-toolchain-view

          (
            cd ci-artifact

            spdx_name="${package_name%.deb}.spdx.json"

            expected_files=(
              "$package_name"
              "$spdx_name"
              PROVENANCE.json
              "$source_name"
              BUILD-MATERIALS.json
              TOOLCHAIN.json
            )

            mapfile -t actual_files < <(
              find . \
                -maxdepth 1 \
                -type f \
                ! -name SHA256SUMS \
                -printf '%f\n' |
              sort
            )

            mapfile -t expected_sorted < <(
              printf '%s\n' "${expected_files[@]}" |
              sort
            )

            diff -u \
              <(printf '%s\n' "${expected_sorted[@]}") \
              <(printf '%s\n' "${actual_files[@]}")

            mapfile -t checksum_files < <(
              printf '%s\n' "${expected_files[@]}" |
              sort
            )

            [[ "${#checksum_files[@]}" -eq 6 ]] || {
              echo "ERROR: expected exactly six CI payload files" >&2
              exit 1
            }

            sha256sum "${checksum_files[@]}" > SHA256SUMS
          )

          echo "===== CI ARTIFACT ====="
          ls -l ci-artifact

          echo
          cat ci-artifact/SHA256SUMS

      - name: Scan complete CI artifact privacy boundary
        run: |
          set -euo pipefail
          python3 tools/privacy-scan.py ci-artifact

      - name: Upload audited Debian package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: |
            ci-artifact/*.deb
            ci-artifact/*.spdx.json
            ci-artifact/PROVENANCE.json
            ci-artifact/open-ipod-sync-*-source.tar
            ci-artifact/BUILD-MATERIALS.json
            ci-artifact/TOOLCHAIN.json
            ci-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  reproducibility-check:
    name: Debian 11 reproducibility gate
    needs: package-build-audit
    runs-on: ubuntu-24.04

    container:
      image: debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure pinned Debian 11 snapshot
        run: |
          set -euo pipefail

          # Debian 11 Bullseye reached LTS EOL in August 2026.
          #
          # Pin CI to a coherent Debian Snapshot from immediately before EOL.
          # This avoids retired/archive mirrors whose package indexes may refer
          # to binary files that are no longer present in the pool.
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources

          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260830T235959Z/ bullseye-security main
          APT

          # snapshot.debian.org can occasionally return transient gateway
          # errors. Apply retries to both apt update and package downloads.
          cat > /etc/apt/apt.conf.d/80-ci-retries <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          APT

          apt-get update
      - name: Install Debian 11 build dependencies
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            build-essential \
            dpkg-dev \
            pkg-config \
            intltool \
            gettext \
            libglib2.0-dev \
            libsqlite3-dev \
            libimobiledevice-dev \
            libplist-dev \
            libxml2-dev \
            zlib1g-dev \
            libusb-1.0-0-dev \
            file

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust CI checkout for Git metadata
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          git -C "$GITHUB_WORKSPACE" log -1 --format='epoch=%ct date=%cI'

      - name: Create deterministic commit source archive
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git log -1 --format=%ct)"

          [[ "$commit" == "$GITHUB_SHA" ]] || {
            echo "ERROR: checked-out commit does not match workflow SHA" >&2
            exit 1
          }

          ./tests/test_source_archive.sh

          mkdir -p source-artifact

          archive="source-artifact/open-ipod-sync-${commit}-source.tar"

          ./tools/make-source-archive.sh \
            "$archive" \
            "$commit"

          embedded_commit="$(
            git get-tar-commit-id < "$archive"
          )"

          [[ "$embedded_commit" == "$commit" ]] || {
            echo "ERROR: source archive commit mismatch" >&2
            exit 1
          }

          (
            cd source-artifact
            sha256sum "$(basename "$archive")" > SOURCE-SHA256SUMS
            sha256sum -c SOURCE-SHA256SUMS
          )

          echo \
            "REPRO_SOURCE_DATE_EPOCH=$source_date_epoch" \
            >> "$GITHUB_ENV"

          echo "deterministic source archive: PASS"

      - name: Download audited build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: baseline

      - name: Verify audited build artifact
        run: |
          set -euo pipefail

          (
            cd baseline
            sha256sum -c SHA256SUMS
          )

      - name: Build independent comparison package
        run: |
          set -euo pipefail

          (
            cd source-artifact
            sha256sum -c SOURCE-SHA256SUMS
          )

          mapfile -t source_archives < <(
            find source-artifact \
              -maxdepth 1 \
              -type f \
              -name 'open-ipod-sync-*-source.tar' \
              -print |
            sort
          )

          [[ "${#source_archives[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one deterministic source archive" >&2
            printf '%s\n' "${source_archives[@]}" >&2
            exit 1
          }

          rm -rf reproducibility-matrix

          ./tools/run-reproducibility-matrix.sh \
            "${source_archives[0]}" \
            "$GITHUB_SHA" \
            "$REPRO_SOURCE_DATE_EPOCH" \
            reproducibility-matrix \
            "debian-11-amd64-snapshot-20260830T235959Z" \
            "debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9"

          cmp -s \
            reproducibility-matrix/materials/builder-a.json \
            reproducibility-matrix/materials/builder-b.json || {
              echo "ERROR: isolated builder material manifests differ" >&2
              exit 1
            }

          echo "isolated builder material manifests: PASS"

          cmp -s \
            baseline/BUILD-MATERIALS.json \
            reproducibility-matrix/materials/builder-a.json || {
              echo "ERROR: canonical BUILD-MATERIALS differs from isolated builder" >&2
              exit 1
            }

          cmp -s \
            baseline/TOOLCHAIN.json \
            reproducibility-matrix/materials/toolchain-a.json || {
              echo "ERROR: canonical TOOLCHAIN differs from isolated builder" >&2
              exit 1
            }

          cmp -s \
            "baseline/open-ipod-sync-${GITHUB_SHA}-source.tar" \
            "source-artifact/open-ipod-sync-${GITHUB_SHA}-source.tar" || {
              echo "ERROR: canonical source archive differs from rebuild source" >&2
              exit 1
            }

          echo "canonical public evidence matches isolated evidence: PASS"
      - name: Generate independent SBOM and provenance
        run: |
          set -euo pipefail

          rm -rf \
            rebuilt-bundle \
            rebuilt-bundle-alt

          cp -a \
            reproducibility-matrix/builder-a \
            rebuilt-bundle

          cp -a \
            reproducibility-matrix/builder-b \
            rebuilt-bundle-alt

          for bundle in \
              rebuilt-bundle \
              rebuilt-bundle-alt
          do
            (
              cd "$bundle"

              sha256sum -c SHA256SUMS

              mapfile -t names < <(
                find . \
                  -maxdepth 1 \
                  -type f \
                  -printf '%f\n' |
                sort
              )

              [[ "${#names[@]}" -eq 4 ]] || {
                echo "ERROR: unexpected reproducibility bundle: $bundle" >&2
                printf '%s\n' "${names[@]}" >&2
                exit 1
              }
            )
          done

          echo "two independent supply-chain bundles: PASS"
      - name: Scan downloaded and rebuilt artifact privacy boundaries
        run: |
          set -euo pipefail
          python3 tools/privacy-scan.py baseline rebuilt-bundle rebuilt-bundle-alt
          python3 tools/privacy-scan.py source-artifact

      - name: Verify reproducible Debian package and supply-chain metadata
        run: |
          set -euo pipefail

          for bundle in \
              baseline \
              rebuilt-bundle \
              rebuilt-bundle-alt
          do
            [[ -d "$bundle" ]] || {
              echo "ERROR: missing reproducibility bundle: $bundle" >&2
              exit 1
            }

            (
              cd "$bundle"
              sha256sum -c SHA256SUMS
            )
          done

          mapfile -t baseline_names < <(
            find baseline \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
            sort
          )

          # baseline/SHA256SUMS covers the complete canonical CI
          # evidence set.  Isolated rebuild SHA256SUMS files cover only
          # the reproducible core, so compare the three core payloads
          # directly and compare a derived core checksum manifest below.
          mapfile -t baseline_core_names < <(
            find baseline \
              -maxdepth 1 \
              -type f \
              \( \
                -name 'ipod-sync_*_amd64.deb' -o \
                -name '*.spdx.json' -o \
                -name 'PROVENANCE.json' \
              \) \
              -printf '%f\n' |
            sort
          )

          mapfile -t rebuilt_names < <(
            find rebuilt-bundle \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
            sort
          )

          mapfile -t alternate_names < <(
            find rebuilt-bundle-alt \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
            sort
          )

          mapfile -t rebuilt_core_names < <(
            find rebuilt-bundle \
              -maxdepth 1 \
              -type f \
              \( \
                -name 'ipod-sync_*_amd64.deb' -o \
                -name '*.spdx.json' -o \
                -name 'PROVENANCE.json' \
              \) \
              -printf '%f\n' |
            sort
          )

          mapfile -t alternate_core_names < <(
            find rebuilt-bundle-alt \
              -maxdepth 1 \
              -type f \
              \( \
                -name 'ipod-sync_*_amd64.deb' -o \
                -name '*.spdx.json' -o \
                -name 'PROVENANCE.json' \
              \) \
              -printf '%f\n' |
            sort
          )

          [[ "${#baseline_names[@]}" -eq 7 ]] || {
            echo "ERROR: audited baseline should contain exactly seven files" >&2
            printf '%s\n' "${baseline_names[@]}" >&2
            exit 1
          }

          [[ "${#baseline_core_names[@]}" -eq 3 ]] || {
            echo "ERROR: baseline reproducible core should contain exactly three payload files" >&2
            printf '%s\n' "${baseline_core_names[@]}" >&2
            exit 1
          }

          for evidence in \
              "open-ipod-sync-${GITHUB_SHA}-source.tar" \
              BUILD-MATERIALS.json \
              TOOLCHAIN.json
          do
            [[ -f "baseline/$evidence" ]] || {
              echo "ERROR: canonical evidence missing: $evidence" >&2
              exit 1
            }
          done

          [[ "${#rebuilt_names[@]}" -eq 4 ]] || {
            echo "ERROR: rebuilt bundle should contain exactly four files" >&2
            printf '%s\n' "${rebuilt_names[@]}" >&2
            exit 1
          }

          [[ "${#rebuilt_core_names[@]}" -eq 3 ]] || {
            echo "ERROR: rebuilt core should contain exactly three payload files" >&2
            printf '%s\n' "${rebuilt_core_names[@]}" >&2
            exit 1
          }

          [[ "${#alternate_names[@]}" -eq 4 ]] || {
            echo "ERROR: alternate bundle should contain exactly four files" >&2
            printf '%s\n' "${alternate_names[@]}" >&2
            exit 1
          }

          [[ "${#alternate_core_names[@]}" -eq 3 ]] || {
            echo "ERROR: alternate core should contain exactly three payload files" >&2
            printf '%s\n' "${alternate_core_names[@]}" >&2
            exit 1
          }

          diff -u \
            <(printf '%s\n' "${baseline_core_names[@]}") \
            <(printf '%s\n' "${rebuilt_core_names[@]}")

          diff -u \
            <(printf '%s\n' "${rebuilt_core_names[@]}") \
            <(printf '%s\n' "${alternate_core_names[@]}")

          echo
          echo "===== BASELINE vs SOURCE-ARCHIVE BUILDER A ====="

          for name in "${baseline_core_names[@]}"; do
            cmp -s \
              "baseline/$name" \
              "rebuilt-bundle/$name" || {
                echo "ERROR: baseline differs from builder A: $name" >&2
                exit 1
              }

            printf '%-42s PASS\n' "$name"
          done

          echo
          echo "===== BUILDER A vs VARIED-ENVIRONMENT BUILDER B ====="

          for name in "${rebuilt_core_names[@]}"; do
            cmp -s \
              "rebuilt-bundle/$name" \
              "rebuilt-bundle-alt/$name" || {
                echo "ERROR: environment matrix differs: $name" >&2
                exit 1
              }

            printf '%-42s PASS\n' "$name"
          done

          echo
          echo "===== CORE CHECKSUM MANIFEST IDENTITY ====="

          (
            cd baseline
            sha256sum "${baseline_core_names[@]}"
          ) > baseline-core-SHA256SUMS

          cmp -s \
            baseline-core-SHA256SUMS \
            rebuilt-bundle/SHA256SUMS || {
              echo "ERROR: baseline-derived core checksum manifest differs from builder A" >&2
              diff -u \
                baseline-core-SHA256SUMS \
                rebuilt-bundle/SHA256SUMS >&2 || true
              exit 1
            }

          cmp -s \
            baseline-core-SHA256SUMS \
            rebuilt-bundle-alt/SHA256SUMS || {
              echo "ERROR: baseline-derived core checksum manifest differs from builder B" >&2
              diff -u \
                baseline-core-SHA256SUMS \
                rebuilt-bundle-alt/SHA256SUMS >&2 || true
              exit 1
            }

          echo "baseline-derived core SHA256SUMS vs builder A: PASS"
          echo "baseline-derived core SHA256SUMS vs builder B: PASS"

          echo
          echo "============================================================"
          echo "PASS: reproducible core payloads are byte-identical"
          echo "PASS: reproducible core checksum manifests are identical"
          echo "PASS: varied build environments are byte-identical"
          echo "============================================================"
      - name: Configure pinned Debian 11 snapshot
        run: |
          set -euo pipefail

          # Debian 11 Bullseye reached LTS EOL in August 2026.
          #
          # Pin CI to a coherent Debian Snapshot from immediately before EOL.
          # This avoids retired/archive mirrors whose package indexes may refer
          # to binary files that are no longer present in the pool.
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources

          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260830T235959Z/ bullseye-security main
          APT

          # snapshot.debian.org can occasionally return transient gateway
          # errors. Apply retries to both apt update and package downloads.
          cat > /etc/apt/apt.conf.d/80-ci-retries <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          APT

          apt-get update

  package-lifecycle:
    name: Debian 11 package lifecycle
    needs: package-build-audit
    runs-on: ubuntu-24.04

    container:
      image: debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure pinned Debian 11 snapshot
        run: |
          set -euo pipefail

          # Debian 11 Bullseye reached LTS EOL in August 2026.
          #
          # Pin CI to a coherent Debian Snapshot from immediately before EOL.
          # This avoids retired/archive mirrors whose package indexes may refer
          # to binary files that are no longer present in the pool.
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources

          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260830T235959Z/ bullseye-security main
          APT

          # snapshot.debian.org can occasionally return transient gateway
          # errors. Apply retries to both apt update and package downloads.
          cat > /etc/apt/apt.conf.d/80-ci-retries <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          APT

          apt-get update


      - name: Install Debian 11 runtime dependencies
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            diffutils \
            ifuse \
            libimobiledevice-utils \
            usbmuxd \
            ffmpeg \
            gcc \
            pkg-config \
            libglib2.0-dev \
            util-linux \
            libc6 \
            libglib2.0-0 \
            libimobiledevice6 \
            libplist3 \
            libsqlite3-0 \
            libxml2 \
            zlib1g \
            libusb-1.0-0

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download audited Debian package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: lifecycle-artifact

      - name: Verify audited artifact checksum
        run: |
          set -euo pipefail

          (
            cd lifecycle-artifact
            sha256sum -c SHA256SUMS
          )

      - name: Scan lifecycle artifact privacy boundary
        run: |
          set -euo pipefail
          python3 tools/privacy-scan.py lifecycle-artifact

      - name: Run package lifecycle tests
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find lifecycle-artifact \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one audited Debian package" >&2
            exit 1
          fi

          ./tools/test-package-lifecycle.sh "${packages[0]}"

  ubuntu-host-compatibility:
    name: Ubuntu host compatibility — ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show host environment
        shell: bash
        run: |
          set -euo pipefail

          echo "runner: ${{ matrix.os }}"
          cat /etc/os-release
          echo
          uname -a
          echo
          python3 --version
          gcc --version | head -n 1
          dpkg --print-architecture

      - name: Install source-build dependencies
        shell: bash
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            build-essential \
            dpkg-dev \
            pkg-config \
            intltool \
            gettext \
            libglib2.0-dev \
            libsqlite3-dev \
            libimobiledevice-dev \
            libplist-dev \
            libxml2-dev \
            zlib1g-dev \
            libusb-1.0-0-dev \
            file

      - name: Report library versions
        shell: bash
        run: |
          set -euo pipefail

          echo "glib:"
          pkg-config --modversion glib-2.0

          echo "sqlite3:"
          pkg-config --modversion sqlite3

          echo "libimobiledevice:"
          pkg-config --modversion libimobiledevice-1.0

          echo "libplist:"
          if pkg-config --exists libplist; then
            pkg-config --modversion libplist
          else
            pkg-config --modversion libplist-2.0
          fi

          echo "libxml2:"
          pkg-config --modversion libxml-2.0

      - name: Run public source sanity suite
        shell: bash
        run: |
          set -euo pipefail

          ./tools/public-sanity-check.sh

      - name: Build package from source
        shell: bash
        run: |
          set -euo pipefail

          ./build-deb.sh

          mapfile -t debs < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print |
            sort
          )

          [[ "${#debs[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one amd64 Debian package; " \
                 "found ${#debs[@]}" >&2
            printf '%s\n' "${debs[@]}" >&2
            exit 1
          }

          echo "built package:"
          printf '%s\n' "${debs[0]}"

          dpkg-deb -f "${debs[0]}" \
            Package \
            Version \
            Architecture \
            Depends

      - name: Audit host-built package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t debs < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print |
            sort
          )

          [[ "${#debs[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one package for audit" >&2
            exit 1
          }

          ./tools/audit-deb.sh "${debs[0]}"

      - name: Verify host-generated runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t debs < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print |
            sort
          )

          [[ "${#debs[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one package" >&2
            exit 1
          }

          DEPENDS="$(dpkg-deb -f "${debs[0]}" Depends)"

          echo "Generated package Depends:"
          echo "$DEPENDS"

          python3 - \
            "${{ matrix.os }}" \
            "$DEPENDS" <<'PYDEP'
          import re
          import sys

          host = sys.argv[1]
          raw = sys.argv[2]

          names = []

          for group in raw.split(","):
              token = group.strip()

              if "|" in token:
                  raise SystemExit(
                      f"ERROR: unexpected alternative dependency: {token}"
                  )

              name = re.split(r"\s|\(", token, maxsplit=1)[0]

              if not name:
                  raise SystemExit(
                      f"ERROR: could not parse dependency: {token!r}"
                  )

              names.append(name)

          print("dependency package names:")
          for name in names:
              print(f"  {name}")

          common = {
              "libplist-2.0-4",
          }

          if host == "ubuntu-24.04":
              required = common | {
                  "libimobiledevice6",
              }

              forbidden = {
                  "libplist3",
                  "libimobiledevice-1.0-6",
              }

          elif host == "ubuntu-26.04":
              required = common | {
                  "libimobiledevice-1.0-6",
              }

              forbidden = {
                  "libplist3",
                  "libimobiledevice6",
              }

          else:
              raise SystemExit(
                  f"ERROR: unexpected host matrix member: {host}"
              )

          missing = required - set(names)

          if missing:
              raise SystemExit(
                  f"ERROR: missing host ABI dependencies: "
                  f"{sorted(missing)}"
              )

          present_forbidden = forbidden & set(names)

          if present_forbidden:
              raise SystemExit(
                  f"ERROR: stale distro-specific ABI dependencies: "
                  f"{sorted(present_forbidden)}"
              )

          print(f"{host} generated ABI package names: PASS")
          PYDEP

      - name: Install lifecycle runtime tools
        shell: bash
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get install -y --no-install-recommends \
            ifuse \
            libimobiledevice-utils \
            usbmuxd \
            ffmpeg

      - name: Verify distro ifuse safety contract
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(
            dpkg-query \
              -W \
              -f='${Version}' \
              ifuse
          )"

          echo "host:            ${{ matrix.os }}"
          echo "ifuse package:   $PACKAGE_VERSION"
          echo "ifuse binary:    /usr/bin/ifuse"

          /usr/bin/ifuse \
            --version \
            2>&1 \
            || true

          PYTHONDONTWRITEBYTECODE=1 \
          python3 - "$PACKAGE_VERSION" <<'PYSAFE'
          import importlib.util
          import re
          import sys
          from pathlib import Path

          raw_package = sys.argv[1]

          match = re.search(
              r"(?<!\d)(\d+)\.(\d+)\.(\d+)(?!\d)",
              raw_package,
          )

          if match is None:
              raise SystemExit(
                  "ERROR: cannot parse distro ifuse package "
                  f"version: {raw_package!r}"
              )

          package_semver = tuple(
              int(part)
              for part in match.groups()
          )

          source = (
              Path.cwd()
              / "src"
              / "ipod_sync.py"
          )

          spec = importlib.util.spec_from_file_location(
              "ipod_sync_distro_ifuse_test",
              source,
          )

          if spec is None or spec.loader is None:
              raise SystemExit(
                  "ERROR: unable to load ipod_sync.py"
              )

          module = importlib.util.module_from_spec(
              spec
          )

          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          try:
              detected = module.require_safe_ifuse(
                  "/usr/bin/ifuse"
              )
          except module.SyncError as exc:
              message = str(exc)

              if package_semver != (1, 2, 0):
                  raise SystemExit(
                      "ERROR: distro ifuse was rejected even "
                      f"though package version is {raw_package}: "
                      f"{message}"
                  )

              if (
                  "unsafe ifuse version detected: 1.2.0"
                  not in message
              ):
                  raise SystemExit(
                      "ERROR: wrong known-unsafe refusal: "
                      + message
                  )

              print(
                  "known-unsafe distro ifuse rejection: PASS"
              )

          else:
              if package_semver == (1, 2, 0):
                  raise SystemExit(
                      "ERROR: known-unsafe distro ifuse "
                      "1.2.0 was accepted"
                  )

              print(
                  "safe distro ifuse acceptance: PASS "
                  f"({detected})"
              )
          PYSAFE

      - name: Prepare host through repository bootstrap
        shell: bash
        run: |
          set -euo pipefail

          sudo ./tools/prepare-host.sh

          hash -r

          echo "active ifuse:"
          command -v ifuse

          echo
          echo "active ifuse version:"
          ifuse --version 2>&1

          PYTHONDONTWRITEBYTECODE=1 \
          python3 - <<'PYSAFEHOST'
          import importlib.util
          import sys
          from pathlib import Path

          source = (
              Path.cwd()
              / "src"
              / "ipod_sync.py"
          )

          spec = importlib.util.spec_from_file_location(
              "ipod_sync_prepared_host_test",
              source,
          )

          if spec is None or spec.loader is None:
              raise SystemExit(
                  "ERROR: unable to load ipod_sync.py"
              )

          module = importlib.util.module_from_spec(
              spec
          )

          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          version = module.require_safe_ifuse()

          print(
              "prepared active ifuse accepted: PASS "
              f"({version})"
          )
          PYSAFEHOST

      - name: Run host-built package lifecycle
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t debs < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print |
            sort
          )

          [[ "${#debs[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one package for lifecycle" >&2
            exit 1
          }

          sudo \
            env \
              PATH="$PATH" \
              ./tools/test-package-lifecycle.sh \
              "${debs[0]}"

          echo "host-built package lifecycle: PASS"

      - name: Verify build did not modify tracked source
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          rm -rf -- build dist

          git diff --exit-code
          git diff --cached --exit-code

          echo "tracked source remains unchanged: PASS"

  ubuntu2604-reproducibility-check:
    name: Ubuntu 26.04 independent reproducibility gate
    needs: ubuntu-host-compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Ubuntu reproducibility CI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_ubuntu2604_repro_contract.py
          python3 tests/test_ubuntu2604_uutils_toolchain.py

      - name: Verify pinned Ubuntu 26.04 image and APT snapshot
        shell: bash
        run: |
          set -euo pipefail
          bash tools/verify-ubuntu2604-pinned-inputs.sh

      - name: Run pinned Ubuntu 26.04 A/B matrix
        shell: bash
        run: |
          set -euo pipefail
          bash tools/test-ubuntu2604-pinned-matrix.sh

      - name: Prepare verified pinned Ubuntu candidate
        shell: bash
        run: |
          set -euo pipefail
          bash tools/prepare-ubuntu2604-pinned-candidate.sh

      - name: Verify pinned Ubuntu candidate for upload
        shell: bash
        run: |
          set -euo pipefail

          candidate="$RUNNER_TEMP/ubuntu2604-pinned-candidate"
          test -d "$candidate"

          (
            cd "$candidate"
            shopt -s nullglob

            debs=(ipod-sync_*_amd64.deb)
            sboms=(ipod-sync_*_amd64.spdx.json)
            sources=(open-ipod-sync-*-source.tar)

            test "${#debs[@]}" -eq 1
            test "${#sboms[@]}" -eq 1
            test "${#sources[@]}" -eq 1

            test "${sboms[0]}" = "${debs[0]%.deb}.spdx.json"
            test "${sources[0]}" =               "open-ipod-sync-${GITHUB_SHA}-source.tar"

            for evidence in               PROVENANCE.json               BUILD-MATERIALS.json               TOOLCHAIN.json               SHA256SUMS
            do
              test -f "$evidence"
            done

            mapfile -t names < <(
              find . -maxdepth 1 -type f -printf '%f\n' |
              LC_ALL=C sort
            )

            test "${#names[@]}" -eq 7
            sha256sum -c SHA256SUMS
          )

          python3 tools/privacy-scan.py "$candidate"

          echo "Ubuntu pinned candidate upload gate: PASS"

      - name: Upload verified pinned Ubuntu package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ipod-sync-ubuntu2604-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/ubuntu2604-pinned-candidate/
          if-no-files-found: error
          retention-days: 14

  dual-platform-release-candidate-check:
    name: Dual-platform release candidate smoke test
    needs:
      - package-build-audit
      - reproducibility-check
      - ubuntu2604-reproducibility-check

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Debian CI bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: ci-debian

      - name: Download Ubuntu CI bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-ubuntu2604-amd64-${{ github.sha }}
          path: ci-ubuntu

      - name: Assemble and verify actual dual-platform candidate
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          shopt -s nullglob
          debian_debs=(ci-debian/ipod-sync_*_amd64.deb)
          ubuntu_debs=(ci-ubuntu/ipod-sync_*_amd64.deb)

          test "${#debian_debs[@]}" -eq 1
          test "${#ubuntu_debs[@]}" -eq 1

          deb_version="$(
            dpkg-deb -f "${debian_debs[0]}" Version
          )"

          test "$deb_version" = "$(
            dpkg-deb -f "${ubuntu_debs[0]}" Version
          )"

          for package in "${debian_debs[0]}" "${ubuntu_debs[0]}"; do
            test "$(dpkg-deb -f "$package" Package)" = ipod-sync
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
          done

          candidate="$RUNNER_TEMP/dual-release-candidate"
          test ! -e "$candidate"

          python3 tools/prepare-dual-release-assets.py             --debian-ci ci-debian             --ubuntu-ci ci-ubuntu             --output "$candidate"             --deb-version "$deb_version"             --public-version "$deb_version"             --commit "$GITHUB_SHA"

          (
            cd "$candidate"
            sha256sum -c SHA256SUMS
          )

          test "$(
            find "$candidate" -mindepth 1 -maxdepth 1 |
            wc -l
          )" -eq 14

          python3 tools/privacy-scan.py "$candidate"

          echo "Real Debian and Ubuntu candidate: PASS"
          echo "Exact 14-file release candidate: PASS"
          echo "Checksum and privacy verification: PASS"

  attest-supply-chain:
    name: GitHub artifact attestations

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - package-build-audit
      - reproducibility-check
      - package-lifecycle
      - ubuntu-host-compatibility
      - ubuntu2604-reproducibility-check

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download audited supply-chain bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: attested

      - name: Verify audited supply-chain bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          (
            cd attested
            sha256sum -c SHA256SUMS
          )

          shopt -s nullglob

          debs=(attested/ipod-sync_*_amd64.deb)
          sboms=(attested/*.spdx.json)
          sources=(attested/open-ipod-sync-*-source.tar)

          [[ "${#debs[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one Debian package; found ${#debs[@]}" >&2
            exit 1
          }

          [[ "${#sboms[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one SPDX SBOM; found ${#sboms[@]}" >&2
            exit 1
          }

          [[ "${#sources[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one source archive; found ${#sources[@]}" >&2
            exit 1
          }

          [[ "$(basename "${sources[0]}")" ==               "open-ipod-sync-${GITHUB_SHA}-source.tar" ]] || {
            echo "ERROR: source archive name does not match commit" >&2
            exit 1
          }

          [[ -f attested/BUILD-MATERIALS.json ]] || {
            echo "ERROR: BUILD-MATERIALS.json missing" >&2
            exit 1
          }

          [[ -f attested/TOOLCHAIN.json ]] || {
            echo "ERROR: TOOLCHAIN.json missing" >&2
            exit 1
          }

          [[ -f attested/PROVENANCE.json ]] || {
            echo "ERROR: PROVENANCE.json missing" >&2
            exit 1
          }

          [[ -f attested/SHA256SUMS ]] || {
            echo "ERROR: SHA256SUMS missing" >&2
            exit 1
          }

          printf 'deb=%s\n' "${debs[0]}" >> "$GITHUB_OUTPUT"
          printf 'sbom=%s\n' "${sboms[0]}" >> "$GITHUB_OUTPUT"

          echo "audited bundle verification: PASS"

      - name: Attest audited release artifacts with SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            attested/*.deb
            attested/*.spdx.json
            attested/PROVENANCE.json
            attested/open-ipod-sync-*-source.tar
            attested/BUILD-MATERIALS.json
            attested/TOOLCHAIN.json
            attested/SHA256SUMS

      - name: Attest Debian package with SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.deb }}
          sbom-path: ${{ steps.bundle.outputs.sbom }}

  attest-ubuntu2604:
    name: GitHub Ubuntu 26.04 pinned artifact attestation

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - ubuntu-host-compatibility
      - ubuntu2604-reproducibility-check

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified pinned Ubuntu bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipod-sync-ubuntu2604-amd64-${{ github.sha }}
          path: attested-ubuntu

      - name: Verify Ubuntu pinned supply-chain bundle
        shell: bash
        run: |
          set -euo pipefail

          bundle="attested-ubuntu"
          test -d "$bundle"
          shopt -s nullglob

          debs=("$bundle"/ipod-sync_*_amd64.deb)
          sboms=("$bundle"/*.spdx.json)
          sources=("$bundle"/open-ipod-sync-*-source.tar)

          [[ "${#debs[@]}" -eq 1 ]]
          [[ "${#sboms[@]}" -eq 1 ]]
          [[ "${#sources[@]}" -eq 1 ]]

          deb="$(basename "${debs[0]}")"
          sbom="${deb%.deb}.spdx.json"
          source="open-ipod-sync-${GITHUB_SHA}-source.tar"

          [[ "$(basename "${sboms[0]}")" == "$sbom" ]]
          [[ "$(basename "${sources[0]}")" == "$source" ]]

          expected=(
            "$deb"
            "$sbom"
            "$source"
            PROVENANCE.json
            BUILD-MATERIALS.json
            TOOLCHAIN.json
            SHA256SUMS
          )

          mapfile -t expected_sorted < <(
            printf '%s\n' "${expected[@]}" | LC_ALL=C sort
          )

          mapfile -t actual < <(
            find "$bundle" -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | LC_ALL=C sort
          )

          diff -u \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${actual[@]}")

          # Reject symlinks, directories and missing files.
          for name in "${expected[@]}"; do
            test -f "$bundle/$name"
            test ! -L "$bundle/$name"
          done

          (
            cd "$bundle"

            # The checksum manifest must cover exactly
            # the six non-manifest payload files.
            mapfile -t expected_hashes < <(
              printf '%s\n' \
                "$deb" "$sbom" "$source" \
                PROVENANCE.json \
                BUILD-MATERIALS.json \
                TOOLCHAIN.json |
              LC_ALL=C sort
            )

            mapfile -t actual_hashes < <(
              awk '{print $2}' SHA256SUMS | LC_ALL=C sort
            )

            diff -u \
              <(printf '%s\n' "${expected_hashes[@]}") \
              <(printf '%s\n' "${actual_hashes[@]}")

            sha256sum -c SHA256SUMS
          )

          embedded_commit="$(
            git get-tar-commit-id < "$bundle/$source"
          )"

          [[ "$embedded_commit" == "$GITHUB_SHA" ]] || {
            echo "ERROR: source archive commit mismatch" >&2
            exit 1
          }

          test "$(
            dpkg-deb -f "${debs[0]}" Architecture
          )" = amd64

          echo "Ubuntu exact seven-file contract: PASS"
          echo "Ubuntu checksum integrity: PASS"
          echo "Ubuntu source commit identity: PASS"

      - name: Scan Ubuntu attestation privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/privacy-scan.py attested-ubuntu
          echo "Ubuntu attestation privacy boundary: PASS"

      - name: Attest verified Ubuntu pinned bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            attested-ubuntu/*.deb
            attested-ubuntu/*.spdx.json
            attested-ubuntu/PROVENANCE.json
            attested-ubuntu/BUILD-MATERIALS.json
            attested-ubuntu/TOOLCHAIN.json
            attested-ubuntu/open-ipod-sync-*-source.tar
            attested-ubuntu/SHA256SUMS

      - name: Independently verify Ubuntu GitHub attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh --version
          shopt -s nullglob

          files=(attested-ubuntu/*)
          [[ "${#files[@]}" -eq 7 ]]

          for file in "${files[@]}"; do
            verified=false

            # Allow for brief GitHub API indexing delay.
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "Attestation verification attempt ${attempt}/8 for $(basename "$file")"

              if gh attestation verify "$file" \
                --repo "$GITHUB_REPOSITORY" \
                --source-ref "refs/heads/main" \
                --source-digest "$GITHUB_SHA" \
                --signer-workflow \
                  "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
                --deny-self-hosted-runners
              then
                verified=true
                break
              fi

              sleep 5
            done

            if [[ "$verified" != true ]]; then
              echo "ERROR: attestation failed: $file" >&2
              exit 1
            fi

            echo "verified: $(basename "$file")"
          done

          echo "Ubuntu GitHub signed attestations: PASS"
