name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-sanity:
    name: Public source sanity — Python 3.9
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Show environment
        run: |
          set -euo pipefail
          python3 --version
          bash --version | head -n 1
          git --version

      - name: Check tracked files for whitespace errors
        run: |
          set -euo pipefail
          git diff --check

      - name: Run public source sanity checks
        run: |
          set -euo pipefail
          ./tools/public-sanity-check.sh

      - name: Verify tests did not modify source tree
        run: |
          set -euo pipefail

          status="$(git status --porcelain --untracked-files=all)"

          if [ -n "$status" ]; then
            echo "ERROR: CI checks modified or generated files in the source tree:"
            printf '%s\n' "$status"
            exit 1
          fi

          echo "source tree remains clean: PASS"

  package-build-audit:
    name: Debian 11 package build + audit
    needs:
      - public-source-sanity

    runs-on: ubuntu-latest
    timeout-minutes: 25

    container:
      image: debian:11

    defaults:
      run:
        shell: bash

    steps:
      - name: Install Debian 11 build dependencies
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          # Debian 11 Bullseye reached LTS EOL in August 2026.
          #
          # Pin CI to a coherent Debian Snapshot from immediately before EOL.
          # This avoids retired/archive mirrors whose package indexes may refer
          # to binary files that are no longer present in the pool.
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources

          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260830T235959Z/ bullseye-security main
          APT

          # snapshot.debian.org can occasionally return transient gateway
          # errors. Apply retries to both apt update and package downloads.
          cat > /etc/apt/apt.conf.d/80-ci-retries <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          APT

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            build-essential \
            dpkg-dev \
            pkg-config \
            intltool \
            gettext \
            libglib2.0-dev \
            libsqlite3-dev \
            libimobiledevice-dev \
            libplist-dev \
            libxml2-dev \
            zlib1g-dev \
            libusb-1.0-0-dev \
            file

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trust CI checkout for Git metadata
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          git -C "$GITHUB_WORKSPACE" log -1 --format='epoch=%ct date=%cI'

      - name: Verify Debian build environment
        run: |
          set -euo pipefail

          cat /etc/debian_version
          python3 --version
          gcc --version | head -n 1
          dpkg-deb --version | head -n 1
          dpkg-query -W -f='dpkg=${Version}\n' dpkg
          xz --version | head -n 1
          tar --version | head -n 1
          dpkg --print-architecture

          python3 --version | grep -E '^Python 3\.9\.'
          test "$(dpkg --print-architecture)" = "amd64"

          echo "Debian 11 amd64 build environment: PASS"

      - name: Run source sanity checks on Debian 11
        run: |
          set -euo pipefail
          ./tools/public-sanity-check.sh

      - name: Build Debian package
        run: |
          set -euo pipefail
          ./build-deb.sh

      - name: Audit Debian package
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one Debian package; found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          ./tools/audit-deb.sh "${packages[0]}"
      - name: Prepare audited CI artifact
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one audited Debian package" >&2
            exit 1
          fi

          mkdir -p ci-artifact

          cp "${packages[0]}" ci-artifact/

          (
            cd ci-artifact
            sha256sum ./*.deb > SHA256SUMS
          )

          echo "===== CI ARTIFACT ====="
          cat ci-artifact/SHA256SUMS

      - name: Upload audited Debian package
        uses: actions/upload-artifact@v7
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: |
            ci-artifact/*.deb
            ci-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  reproducibility-check:
    name: Debian 11 reproducibility gate
    needs: package-build-audit
    runs-on: ubuntu-latest

    container:
      image: debian:11

    steps:
      - name: Install Debian 11 build dependencies
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources

          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260830T235959Z/ bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260830T235959Z/ bullseye-security main
          APT

          cat > /etc/apt/apt.conf.d/80-ci-retries <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          APT

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            bash \
            python3 \
            build-essential \
            dpkg-dev \
            pkg-config \
            intltool \
            gettext \
            libglib2.0-dev \
            libsqlite3-dev \
            libimobiledevice-dev \
            libplist-dev \
            libxml2-dev \
            zlib1g-dev \
            libusb-1.0-0-dev \
            file

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trust CI checkout for Git metadata
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          git -C "$GITHUB_WORKSPACE" log -1 --format='epoch=%ct date=%cI'

      - name: Download audited build
        uses: actions/download-artifact@v8
        with:
          name: ipod-sync-debian11-amd64-${{ github.sha }}
          path: baseline

      - name: Verify audited build artifact
        run: |
          set -euo pipefail

          (
            cd baseline
            sha256sum -c SHA256SUMS
          )

      - name: Build independent comparison package
        run: |
          set -euo pipefail
          ./build-deb.sh

      - name: Verify reproducible Debian package
        run: |
          set -euo pipefail

          mapfile -t baseline_packages < <(
            find baseline \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          mapfile -t rebuilt_packages < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print
          )

          if [[ "${#baseline_packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one baseline package" >&2
            exit 1
          fi

          if [[ "${#rebuilt_packages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one independently rebuilt package" >&2
            exit 1
          fi

          baseline="${baseline_packages[0]}"
          rebuilt="${rebuilt_packages[0]}"

          echo "===== BASELINE ====="
          sha256sum "$baseline"

          echo
          echo "===== INDEPENDENT REBUILD ====="
          sha256sum "$rebuilt"

          echo
          echo "===== REPRODUCIBILITY ====="

          if ! cmp -s "$baseline" "$rebuilt"; then
            echo "ERROR: Debian package is not byte-for-byte reproducible" >&2
            exit 1
          fi

          echo "PASS: Debian package is byte-for-byte reproducible"

