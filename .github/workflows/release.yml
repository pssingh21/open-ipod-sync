name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0-alpha.8"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      actions: read
      attestations: read
      contents: read

    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      deb_version: ${{ steps.vars.outputs.deb_version }}
      public_version: ${{ steps.vars.outputs.public_version }}
      ci_run_id: ${{ steps.ci.outputs.run_id }}

    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity
        id: vars
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "ERROR: releases may only be dispatched from main" >&2
            exit 1
          }

          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || {
            echo "ERROR: unsupported release version: $RELEASE_VERSION" >&2
            exit 1
          }

          git fetch --no-tags origin main

          MAIN_SHA="$(git rev-parse origin/main)"

          echo "dispatch SHA: $GITHUB_SHA"
          echo "main SHA:     $MAIN_SHA"

          [[ "$MAIN_SHA" == "$GITHUB_SHA" ]] || {
            echo "ERROR: dispatched commit is not the current main HEAD" >&2
            exit 1
          }

          DEB_VERSION="${RELEASE_VERSION/-alpha./~alpha}"
          PUBLIC_VERSION="${DEB_VERSION//\~/.}"
          TAG="v${RELEASE_VERSION}"

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "deb_version=$DEB_VERSION" >> "$GITHUB_OUTPUT"
          echo "public_version=$PUBLIC_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "application version: $RELEASE_VERSION"
          echo "Debian version:      $DEB_VERSION"
          echo "public asset version:$PUBLIC_VERSION"
          echo "tag:                 $TAG"

          grep -Fx "VERSION = \"$RELEASE_VERSION\"" \
            src/ipod_sync.py >/dev/null || {
            echo "ERROR: src/ipod_sync.py version does not match input" >&2
            exit 1
          }

          grep -Fx "VER=\"$DEB_VERSION\"" \
            build-deb.sh >/dev/null || {
            echo "ERROR: build-deb.sh version does not match input" >&2
            exit 1
          }

          python3 - "$RELEASE_VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]

          changelog = Path("CHANGELOG.md").read_text()
          readme = Path("README.md").read_text()

          heading = re.compile(
              rf"^## {re.escape(version)} — "
              r"\d{4}-\d{2}-\d{2}$",
              re.MULTILINE,
          )

          matches = heading.findall(changelog)

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one dated release "
                  f"heading for {version}; found {len(matches)}"
              )

          if f"## {version} — Unreleased" in changelog:
              raise SystemExit(
                  f"ERROR: {version} is still marked Unreleased"
              )

          marker = "Current release:\n\n```text\n"
          start = readme.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: README current-release block not found"
              )

          start += len(marker)
          end = readme.find("\n```", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: malformed README current-release block"
              )

          current = readme[start:end].strip()

          if current != version:
              raise SystemExit(
                  f"ERROR: README current release is {current!r}, "
                  f"expected {version!r}"
              )

          print("release documentation identity: PASS")
          PY

          if git ls-remote --exit-code \
              --tags origin \
              "refs/tags/$TAG" >/dev/null 2>&1
          then
            echo "ERROR: release tag already exists: $TAG" >&2
            exit 1
          fi

          if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            echo "ERROR: GitHub Release already exists: $TAG" >&2
            exit 1
          fi

          IMMUTABLE="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq '.enabled'
          )"

          [[ "$IMMUTABLE" == "true" ]] || {
            echo "ERROR: immutable releases are not enabled" >&2
            exit 1
          }

          echo "tag/release absence + immutable policy: PASS"

      - name: Locate exact successful main CI run
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_JSON="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --branch main \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 1 \
              --json databaseId,headSha,status,conclusion,url
          )"

          printf '%s\n' "$RUN_JSON"

          RUN_ID="$(
            python3 - "$GITHUB_SHA" "$RUN_JSON" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          runs = json.loads(sys.argv[2])

          if len(runs) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one main push CI run "
                  f"for {expected}; found {len(runs)}"
              )

          run = runs[0]

          if run["headSha"] != expected:
              raise SystemExit(
                  f"ERROR: CI SHA {run['headSha']} != {expected}"
              )

          if run["status"] != "completed":
              raise SystemExit(
                  f"ERROR: CI is not completed: {run['status']}"
              )

          if run["conclusion"] != "success":
              raise SystemExit(
                  f"ERROR: CI conclusion is {run['conclusion']}"
              )

          print(run["databaseId"])
          PY
          )"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          python3 - "$GITHUB_REPOSITORY" "$RUN_ID" <<'PY'
          import json
          import subprocess
          import sys

          repo = sys.argv[1]
          run_id = sys.argv[2]

          doc = json.loads(
              subprocess.check_output(
                  [
                      "gh", "run", "view", run_id,
                      "--repo", repo,
                      "--json", "jobs",
                  ],
                  text=True,
              )
          )

          jobs = {
              job["name"]: job["conclusion"]
              for job in doc["jobs"]
          }

          required = {
              "Public source sanity — Python 3.9",
              "Debian 11 package build + audit",
              "Debian 11 reproducibility gate",
              "Debian 11 package lifecycle",
              "Ubuntu host compatibility — ubuntu-24.04",
              "Ubuntu host compatibility — ubuntu-26.04",
              "Ubuntu 26.04 independent reproducibility gate",
              "Dual-platform release candidate smoke test",
              "GitHub artifact attestations",
              "GitHub Ubuntu 26.04 pinned artifact attestation",
          }

          missing = required - set(jobs)

          if missing:
              raise SystemExit(
                  f"ERROR: missing CI jobs: {sorted(missing)}"
              )

          bad = {
              name: jobs[name]
              for name in required
              if jobs[name] != "success"
          }

          if bad:
              raise SystemExit(
                  f"ERROR: non-success CI jobs: {bad}"
              )

          print("exact main CI gate set: PASS")
          PY

      - name: Download exact CI artifact bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail

          mkdir -p ci-bundle

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "ipod-sync-debian11-amd64-$GITHUB_SHA" \
            --dir ci-bundle

          find ci-bundle \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort

      - name: Scan downloaded CI bundle privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/privacy-scan.py ci-bundle

      - name: Verify CI bundle and attestations
        shell: bash
        env:
          EXPECTED_DEB_VERSION: ${{ steps.vars.outputs.deb_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          (
            cd ci-bundle
            sha256sum -c SHA256SUMS
          )

          mapfile -t DEBS < <(
            find ci-bundle \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.deb' \
              -print |
            sort
          )

          mapfile -t SPDXS < <(
            find ci-bundle \
              -maxdepth 1 \
              -type f \
              -name 'ipod-sync_*_amd64.spdx.json' \
              -print |
            sort
          )

          mapfile -t SOURCES < <(
            find ci-bundle \
              -maxdepth 1 \
              -type f \
              -name 'open-ipod-sync-*-source.tar' \
              -print |
            sort
          )

          [[ "${#DEBS[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one Debian artifact" >&2
            exit 1
          }

          [[ "${#SPDXS[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one SPDX artifact" >&2
            exit 1
          }

          [[ "${#SOURCES[@]}" -eq 1 ]] || {
            echo "ERROR: expected exactly one deterministic source archive" >&2
            exit 1
          }

          DEB="${DEBS[0]}"
          SPDX="${SPDXS[0]}"
          SOURCE="${SOURCES[0]}"

          [[ "$(basename "$SOURCE")" ==               "open-ipod-sync-${GITHUB_SHA}-source.tar" ]] || {
            echo "ERROR: source archive filename does not match release commit" >&2
            exit 1
          }

          for f in \
              "$DEB" \
              "$SPDX" \
              "$SOURCE" \
              ci-bundle/PROVENANCE.json \
              ci-bundle/BUILD-MATERIALS.json \
              ci-bundle/TOOLCHAIN.json \
              ci-bundle/SHA256SUMS
          do
            [[ -f "$f" ]] || {
              echo "ERROR: required CI artifact missing: $f" >&2
              exit 1
            }
          done

          mapfile -t CI_BUNDLE_NAMES < <(
            find ci-bundle \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
            sort
          )

          expected_ci_bundle=(
            "$(basename "$DEB")"
            "$(basename "$SPDX")"
            "$(basename "$SOURCE")"
            PROVENANCE.json
            BUILD-MATERIALS.json
            TOOLCHAIN.json
            SHA256SUMS
          )

          mapfile -t expected_ci_bundle_sorted < <(
            printf '%s\n' "${expected_ci_bundle[@]}" |
            sort
          )

          diff -u \
            <(printf '%s\n' "${expected_ci_bundle_sorted[@]}") \
            <(printf '%s\n' "${CI_BUNDLE_NAMES[@]}")

          [[ "${#CI_BUNDLE_NAMES[@]}" -eq 7 ]] || {
            echo "ERROR: expected exactly seven CI artifact files" >&2
            exit 1
          }

          [[ "$(dpkg-deb -f "$DEB" Version)" == \
              "$EXPECTED_DEB_VERSION" ]] || {
            echo "ERROR: Debian artifact version mismatch" >&2
            exit 1
          }

          grep -F "$GITHUB_SHA" \
            ci-bundle/PROVENANCE.json >/dev/null || {
            echo "ERROR: release SHA missing from provenance" >&2
            exit 1
          }

          grep -F "$GITHUB_SHA" \
            ci-bundle/BUILD-MATERIALS.json >/dev/null || {
            echo "ERROR: release SHA missing from build materials" >&2
            exit 1
          }

          embedded_commit="$(
            git get-tar-commit-id < "$SOURCE"
          )"

          [[ "$embedded_commit" == "$GITHUB_SHA" ]] || {
            echo "ERROR: source archive embedded commit mismatch" >&2
            exit 1
          }

          gh attestation verify "$DEB" \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify "$DEB" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify "$SPDX" \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify ci-bundle/PROVENANCE.json \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify ci-bundle/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify "$SOURCE" \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify ci-bundle/BUILD-MATERIALS.json \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify ci-bundle/TOOLCHAIN.json \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          echo "CI checksums + attestations + verification evidence: PASS"

      - name: Download exact Ubuntu 26.04 CI bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail

          mkdir -p ci-ubuntu2604

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "ipod-sync-ubuntu2604-amd64-$GITHUB_SHA" \
            --dir ci-ubuntu2604

          echo "Ubuntu bundle downloaded from exact main CI run"

      - name: Verify Ubuntu 26.04 CI bundle and attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEB_VERSION: ${{ steps.vars.outputs.deb_version }}
        run: |
          set -euo pipefail

          bundle="ci-ubuntu2604"
          deb="ipod-sync_${EXPECTED_DEB_VERSION}_amd64.deb"
          spdx="${deb%.deb}.spdx.json"
          source="open-ipod-sync-${GITHUB_SHA}-source.tar"

          echo "===== EXACT UBUNTU ARTIFACT FILE SET ====="

          expected=(
            "$deb"
            "$spdx"
            "$source"
            PROVENANCE.json
            BUILD-MATERIALS.json
            TOOLCHAIN.json
            SHA256SUMS
          )

          mapfile -t expected_sorted < <(
            printf '%s\n' "${expected[@]}" | LC_ALL=C sort
          )

          mapfile -t actual < <(
            find "$bundle" -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | LC_ALL=C sort
          )

          diff -u \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${actual[@]}")

          for name in "${expected[@]}"; do
            test -f "$bundle/$name"
            test ! -L "$bundle/$name"
          done

          echo "Ubuntu seven-file contract: PASS"

          echo "===== CHECKSUM VERIFICATION ====="

          (
            cd "$bundle"

            mapfile -t hashed < <(
              awk '{print $2}' SHA256SUMS |
              LC_ALL=C sort
            )

            mapfile -t expected_hashes < <(
              printf '%s\n' \
                "$deb" "$spdx" "$source" \
                PROVENANCE.json \
                BUILD-MATERIALS.json \
                TOOLCHAIN.json |
              LC_ALL=C sort
            )

            diff -u \
              <(printf '%s\n' "${expected_hashes[@]}") \
              <(printf '%s\n' "${hashed[@]}")

            sha256sum -c SHA256SUMS
          )

          echo "Ubuntu checksum integrity: PASS"

          echo "===== VERIFY PACKAGE AND SOURCE IDENTITY ====="

          test "$(
            dpkg-deb -f "$bundle/$deb" Package
          )" = ipod-sync

          test "$(
            dpkg-deb -f "$bundle/$deb" Version
          )" = "$EXPECTED_DEB_VERSION"

          test "$(
            dpkg-deb -f "$bundle/$deb" Architecture
          )" = amd64

          embedded_commit="$(
            git get-tar-commit-id < "$bundle/$source"
          )"

          test "$embedded_commit" = "$GITHUB_SHA"

          # Debian and Ubuntu must use identical source bytes.
          cmp \
            "$bundle/$source" \
            "ci-bundle/$source"

          echo "Package version and common source: PASS"

          echo "===== VERIFY SUPPLY-CHAIN METADATA ====="

          python3 - "$GITHUB_SHA" "$EXPECTED_DEB_VERSION" <<'PY_META'
          import hashlib
          import json
          import sys
          from pathlib import Path

          commit, version = sys.argv[1:]
          root = Path("ci-ubuntu2604")

          deb = f"ipod-sync_{version}_amd64.deb"
          spdx = deb[:-4] + ".spdx.json"
          source = f"open-ipod-sync-{commit}-source.tar"

          def digest(name):
              return hashlib.sha256(
                  (root / name).read_bytes()
              ).hexdigest()

          def require(condition, message):
              if not condition:
                  raise SystemExit("ERROR: " + message)

          provenance = json.loads(
              (root / "PROVENANCE.json").read_text()
          )
          sbom = json.loads((root / spdx).read_text())
          materials = json.loads(
              (root / "BUILD-MATERIALS.json").read_text()
          )
          toolchain = json.loads(
              (root / "TOOLCHAIN.json").read_text()
          )

          require(
              provenance["schema"] ==
              "open-ipod-sync-provenance-v1",
              "provenance schema",
          )
          require(
              provenance["source"]["git_commit"] == commit,
              "provenance source commit",
          )
          require(
              provenance["subject"] == {
                  "name": deb,
                  "sha256": digest(deb),
              },
              "provenance package subject",
          )
          require(
              provenance["package"]["version"] == version
              and provenance["package"]["architecture"] == "amd64",
              "provenance package version and architecture",
          )
          require(
              provenance["build"]["environment"]
              == "ubuntu-26.04-amd64",
              "Ubuntu build environment",
          )
          require(
              provenance["sbom"]["name"] == spdx
              and provenance["sbom"]["sha256"] == digest(spdx),
              "provenance SPDX linkage",
          )

          require(
              sbom["spdxVersion"] == "SPDX-2.3",
              "SPDX document version",
          )
          packages = [
              item for item in sbom["packages"]
              if item.get("SPDXID") ==
              "SPDXRef-Package-ipod-sync"
          ]
          require(len(packages) == 1, "SPDX root package")
          package = packages[0]
          require(
              package["packageFileName"] == deb
              and package["versionInfo"] == version,
              "SPDX package identity",
          )
          require(
              any(
                  item.get("algorithm") == "SHA256"
                  and item.get("checksumValue") == digest(deb)
                  for item in package["checksums"]
              ),
              "SPDX package digest",
          )

          require(
              materials["schema"] ==
              "open-ipod-sync-build-materials-v1",
              "build materials schema",
          )
          require(
              materials["source"]["commit"] == commit
              and materials["source"]["archive_sha256"]
              == digest(source),
              "build materials source identity",
          )
          env = materials["declared_environment"]
          require(
              env["base_image_identity"] ==
              "docker.io/library/ubuntu@sha256:"
              "88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794",
              "pinned Ubuntu image identity",
          )
          require(
              env["snapshot_identity"] ==
              "ubuntu-26.04-snapshot-20261015T000000Z",
              "pinned Ubuntu snapshot identity",
          )
          require(
              toolchain["schema"] ==
              "open-ipod-sync-toolchain-view-v1",
              "toolchain schema",
          )
          require(
              materials["observed_environment"]["architecture"]
              == "amd64",
              "observed architecture",
          )

          print("Ubuntu provenance linkage: PASS")
          print("Ubuntu SPDX linkage: PASS")
          print("Pinned build materials: PASS")
          print("Toolchain evidence: PASS")
          PY_META

          echo "===== PRIVACY BOUNDARY ====="

          python3 tools/privacy-scan.py "$bundle"

          echo "===== VERIFY GITHUB ATTESTATIONS ====="

          shopt -s nullglob
          subjects=("$bundle"/*)
          test "${#subjects[@]}" -eq 7

          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/heads/main" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow \
                "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --deny-self-hosted-runners \
              >/dev/null

            echo "Verified: $(basename "$subject")"
          done

          gh attestation verify "$bundle/$deb" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --deny-self-hosted-runners \
            >/dev/null

          echo "Signed Ubuntu SPDX evidence: PASS"

          echo "Ubuntu signed CI bundle verification: PASS"

      - name: Prepare immutable release bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
          DEB_VERSION: ${{ steps.vars.outputs.deb_version }}
          PUBLIC_VERSION: ${{ steps.vars.outputs.public_version }}
        run: |
          set -euo pipefail

          mkdir -p release

          CI_DEB="ci-bundle/ipod-sync_${DEB_VERSION}_amd64.deb"
          CI_SPDX="ci-bundle/ipod-sync_${DEB_VERSION}_amd64.spdx.json"
          CI_SOURCE="ci-bundle/open-ipod-sync-${GITHUB_SHA}-source.tar"

          RELEASE_DEB="ipod-sync_${PUBLIC_VERSION}_amd64.deb"
          RELEASE_SPDX="ipod-sync_${PUBLIC_VERSION}_amd64.spdx.json"
          RELEASE_SOURCE="open-ipod-sync-${GITHUB_SHA}-source.tar"

          [[ -f "$CI_DEB" ]] || {
            echo "ERROR: exact CI Debian artifact missing: $CI_DEB" >&2
            exit 1
          }

          [[ -f "$CI_SPDX" ]] || {
            echo "ERROR: exact CI SPDX artifact missing: $CI_SPDX" >&2
            exit 1
          }

          [[ -f "$CI_SOURCE" ]] || {
            echo "ERROR: exact CI source archive missing: $CI_SOURCE" >&2
            exit 1
          }

          [[ -f ci-bundle/BUILD-MATERIALS.json ]] || {
            echo "ERROR: BUILD-MATERIALS.json missing from CI bundle" >&2
            exit 1
          }

          [[ -f ci-bundle/TOOLCHAIN.json ]] || {
            echo "ERROR: TOOLCHAIN.json missing from CI bundle" >&2
            exit 1
          }

          cp "$CI_DEB" \
             "release/$RELEASE_DEB"

          cp "$CI_SPDX" \
             "release/$RELEASE_SPDX"

          cp ci-bundle/PROVENANCE.json \
             release/PROVENANCE.json

          cp ci-bundle/SHA256SUMS \
             release/CI-SHA256SUMS

          cp "$CI_SOURCE" \
             "release/$RELEASE_SOURCE"

          cp ci-bundle/BUILD-MATERIALS.json \
             release/BUILD-MATERIALS.json

          cp ci-bundle/TOOLCHAIN.json \
             release/TOOLCHAIN.json

          cmp -s "$CI_DEB" \
            "release/$RELEASE_DEB"

          cmp -s "$CI_SPDX" \
            "release/$RELEASE_SPDX"

          cmp -s ci-bundle/PROVENANCE.json \
            release/PROVENANCE.json

          cmp -s ci-bundle/SHA256SUMS \
            release/CI-SHA256SUMS

          cmp -s "$CI_SOURCE" \
            "release/$RELEASE_SOURCE"

          cmp -s ci-bundle/BUILD-MATERIALS.json \
            release/BUILD-MATERIALS.json

          cmp -s ci-bundle/TOOLCHAIN.json \
            release/TOOLCHAIN.json

          (
            cd release

            sha256sum \
              "$RELEASE_DEB" \
              "$RELEASE_SPDX" \
              PROVENANCE.json \
              CI-SHA256SUMS \
              "$RELEASE_SOURCE" \
              BUILD-MATERIALS.json \
              TOOLCHAIN.json \
              > SHA256SUMS

            sha256sum -c SHA256SUMS
          )

          python3 - "$RELEASE_VERSION" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text()

          marker = f"## {version} — "
          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  f"ERROR: changelog entry missing for {version}"
              )

          next_heading = text.find("\n## ", start + len(marker))

          if next_heading == -1:
              section = text[start:].rstrip()
          else:
              section = text[start:next_heading].rstrip()

          if "— Unreleased" in section.splitlines()[0]:
              raise SystemExit(
                  f"ERROR: {version} changelog is still Unreleased"
              )

          Path("release/RELEASE-NOTES.md").write_text(
              section + "\n"
          )

          print("release notes extraction: PASS")
          PY

          echo "prepared release bundle:"
          find release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort

      - name: Scan verified release bundle privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/privacy-scan.py release

      - name: Upload verified release bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verified-release-bundle-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish immutable release
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: release

    permissions:
      actions: read
      attestations: read
      contents: write

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-bundle-${{ github.sha }}
          path: release

      - name: Revalidate publication boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "ERROR: publication ref is not main" >&2
            exit 1
          }

          git fetch --no-tags origin main

          MAIN_SHA="$(git rev-parse origin/main)"

          [[ "$MAIN_SHA" == "$GITHUB_SHA" ]] || {
            echo "ERROR: main moved after release dispatch" >&2
            echo "dispatch SHA: $GITHUB_SHA" >&2
            echo "current main: $MAIN_SHA" >&2
            exit 1
          }

          if git ls-remote --exit-code \
              --tags origin \
              "refs/tags/$TAG" >/dev/null 2>&1
          then
            echo "ERROR: tag appeared after preflight: $TAG" >&2
            exit 1
          fi

          if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            echo "ERROR: release appeared after preflight: $TAG" >&2
            exit 1
          fi

          (
            cd release
            sha256sum -c SHA256SUMS
          )

          echo "publication boundary: PASS"

      - name: Scan publication privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/privacy-scan.py release

      - name: Create and push annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" "$GITHUB_SHA" \
            -m "open-ipod-sync $RELEASE_VERSION"

          [[ "$(git cat-file -t "$TAG")" == "tag" ]] || {
            echo "ERROR: release tag is not annotated" >&2
            exit 1
          }

          [[ "$(git rev-parse "$TAG^{}")" == "$GITHUB_SHA" ]] || {
            echo "ERROR: tag does not peel to release commit" >&2
            exit 1
          }

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$TAG"

          REMOTE_TARGET="$(
            git ls-remote origin \
              "refs/tags/$TAG^{}" |
            awk '{print $1}'
          )"

          [[ "$REMOTE_TARGET" == "$GITHUB_SHA" ]] || {
            echo "ERROR: remote tag target mismatch" >&2
            exit 1
          }

          echo "annotated tag publication: PASS"

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_VERSION: ${{ needs.preflight.outputs.public_version }}
        run: |
          set -euo pipefail

          DEB="release/ipod-sync_${PUBLIC_VERSION}_amd64.deb"
          SPDX="release/ipod-sync_${PUBLIC_VERSION}_amd64.spdx.json"

          gh release create "$TAG" \
            "$DEB" \
            "$SPDX" \
            release/PROVENANCE.json \
            release/CI-SHA256SUMS \
            "release/open-ipod-sync-${GITHUB_SHA}-source.tar" \
            release/BUILD-MATERIALS.json \
            release/TOOLCHAIN.json \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --fail-on-no-commits \
            --title "open-ipod-sync $RELEASE_VERSION" \
            --notes-file release/RELEASE-NOTES.md

          echo "release publication requested: PASS"

      - name: Verify published release flags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PUBLIC_VERSION: ${{ needs.preflight.outputs.public_version }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(
            gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,isImmutable,url,assets
          )"

          python3 - \
            "$TAG" \
            "$PUBLIC_VERSION" \
            "$GITHUB_SHA" \
            "$RELEASE_JSON" <<'PY'
          import json
          import sys

          tag = sys.argv[1]
          public_version = sys.argv[2]
          commit = sys.argv[3]
          doc = json.loads(sys.argv[4])

          if doc["tagName"] != tag:
              raise SystemExit("ERROR: release tag mismatch")

          if doc["isDraft"]:
              raise SystemExit("ERROR: release is still draft")

          if not doc["isPrerelease"]:
              raise SystemExit("ERROR: release is not prerelease")

          if not doc["isImmutable"]:
              raise SystemExit("ERROR: release is not immutable")

          expected = {
              "CI-SHA256SUMS",
              "PROVENANCE.json",
              "SHA256SUMS",
              "BUILD-MATERIALS.json",
              "TOOLCHAIN.json",
              f"open-ipod-sync-{commit}-source.tar",
              f"ipod-sync_{public_version}_amd64.deb",
              f"ipod-sync_{public_version}_amd64.spdx.json",
          }

          actual = {
              asset["name"]
              for asset in doc["assets"]
          }

          if actual != expected:
              raise SystemExit(
                  "ERROR: release asset set mismatch\n"
                  f"expected={sorted(expected)}\n"
                  f"actual={sorted(actual)}"
              )

          print("immutable release flags + asset set: PASS")
          print(doc["url"])
          PY

  verify:
    name: Verify published release
    needs:
      - preflight
      - publish

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      attestations: read
      contents: read

    steps:
      - name: Check out exact release commit for verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download published assets fresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p published

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published

          find published \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort

      - name: Scan published release privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/privacy-scan.py published

      - name: Verify published checksums and release attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PUBLIC_VERSION: ${{ needs.preflight.outputs.public_version }}
        run: |
          set -euo pipefail

          (
            cd published
            sha256sum -c SHA256SUMS
          )

          DEB="published/ipod-sync_${PUBLIC_VERSION}_amd64.deb"
          SPDX="published/ipod-sync_${PUBLIC_VERSION}_amd64.spdx.json"
          SOURCE="published/open-ipod-sync-${GITHUB_SHA}-source.tar"
          MATERIALS="published/BUILD-MATERIALS.json"
          TOOLCHAIN="published/TOOLCHAIN.json"

          for required in \
              "$SOURCE" \
              "$MATERIALS" \
              "$TOOLCHAIN"
          do
            [[ -f "$required" ]] || {
              echo "ERROR: published verification asset missing: $required" >&2
              exit 1
            }
          done

          embedded_commit="$(
            git get-tar-commit-id < "$SOURCE"
          )"

          [[ "$embedded_commit" == "$GITHUB_SHA" ]] || {
            echo "ERROR: published source archive commit mismatch" >&2
            exit 1
          }

          grep -F "$GITHUB_SHA" "$MATERIALS" >/dev/null || {
            echo "ERROR: published build materials omit release commit" >&2
            exit 1
          }

          gh release verify "$TAG" \
            --repo "$GITHUB_REPOSITORY"

          for asset in \
              "$DEB" \
              "$SPDX" \
              "$SOURCE" \
              "$MATERIALS" \
              "$TOOLCHAIN" \
              published/PROVENANCE.json \
              published/CI-SHA256SUMS \
              published/SHA256SUMS
          do
            gh release verify-asset \
              "$TAG" \
              "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null
          done

          gh attestation verify "$DEB" \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify "$DEB" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify "$SPDX" \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify published/PROVENANCE.json \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify published/CI-SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify "$SOURCE" \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify "$MATERIALS" \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          gh attestation verify "$TOOLCHAIN" \
            --repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            >/dev/null

          echo
          echo "============================================================"
          echo "AUTOMATED RELEASE: COMPLETE + VERIFIED"
          echo "============================================================"
      - name: Run independent consumer release verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          python3 tools/verify-release.py \
            published \
            --expected-commit "$GITHUB_SHA" \
            --expected-repository \
              "https://github.com/$GITHUB_REPOSITORY" \
            --github \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG"

          echo "independent consumer verification: PASS"
